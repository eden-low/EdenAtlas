# Netlify configuration for EdenAtlas — a static, buildless, multi-page site.
#
# --- History: why this isn't `publish = "."` anymore ---
# The first version of this file published the repo root directly and relied on per-file
# `[[redirects]]` 404-shadow rules to block non-product files (firestore.rules, CLAUDE.md,
# tmp_*.ts, migrate-career.html, etc). Live testing after deploy found several of those
# redirects did not reliably block the file they targeted, and separately — a real structural
# gap, not a redirect-reliability issue — `publish = "."` also served the Netlify Functions
# *source* directory itself as static files at `/netlify/functions/health.js`, a path
# completely different from the real, separately-routed Function endpoint at
# `/.netlify/functions/health`.
#
# The fix is structural: `publish` now points at `site/`, a directory generated by
# `scripts/build-site.js` — a small, dependency-free Node script that copies an explicit
# ALLOWLIST of product files/directories (see that file's ALLOW_FILES/ALLOW_DIRS) into `site/`,
# preserving every relative path exactly (styles.css/scripts.js/js/*/locales/*/images/* stay
# siblings, so no page's relative references change). Anything not on the allowlist — internal
# docs, Firebase/Netlify config, rules source, the Functions source tree, stray tracked files —
# is simply never copied, so there is nothing at that path to serve, regardless of how Netlify's
# redirect engine behaves. This is Netlify's own documented `[build] command` + `publish`
# pattern, not a new build framework: no bundler, no transpilation, no new dependency.
#
# `functions = "netlify/functions"` is unaffected by this change — Netlify reads Function
# source from the repo root independently of `publish`, so `/.netlify/functions/health` (and
# any future function) keeps working with zero code changes. See the completion report for the
# full before/after verification (files present/absent in `site/`, HTTP status checks).
#
# No SPA rewrite: every page is its own real .html file (home.html, login.html, resume.html,
# project.html, atlas.html, etc.) reachable at its exact path. A catch-all
# `/* -> /index.html 200` rewrite would silently serve the public Portfolio for every
# unmatched/typo'd URL and break that direct-access model, so none is configured here —
# unmatched paths fall through to Netlify's own 404.

# `npm run build` runs `build:css` (compiles the pinned local Tailwind v3.4.19 build from
# tailwind.config.js/tailwind-input.css into tailwind.generated.css), then
# scripts/generate-deploy-origin.js (snapshots DEPLOY_PRIME_URL/DEPLOY_URL — build-step-only
# variables, unavailable to a Function at runtime — into a small generated file
# netlify/functions/anilist.js reads at cold start, so a Deploy Preview's exact origin can be
# allowed through that Function's CORS check; see that script's header comment), then
# scripts/build-site.js — see package.json's "build" script. Netlify invokes that one repository
# script rather than duplicating the Tailwind CLI invocation here. This ordering matters: Netlify
# bundles Functions with esbuild only AFTER this whole build command finishes, so the generated
# file already exists on disk by the time netlify/functions/anilist.js is bundled.
[build]
  command = "npm run build"
  publish = "site"
  functions = "netlify/functions"

# --- Staging (Development -> Staging -> Production workflow) ---
# `staging` is a real, stable Git branch (not a per-PR Deploy Preview) whose build is meant to be
# reachable at a stable URL for manual/E2E QA before anything reaches `main`/Production. No
# `[context.staging]` override block is needed here for the build itself to work correctly —
# Netlify already injects CONTEXT="branch-deploy" and BRANCH="staging" into every branch-deploy
# build automatically, which is exactly what js/environment.js's resolveEnvironment() (via
# scripts/generate-build-info.js) reads to tell Staging apart from Production/any other branch.
# CORS also needs no new ALLOWED_ORIGIN entry: netlify/functions/{anilist,discover-ai,assistant,
# weather}.js already auto-allow whatever origin THIS deploy's own DEPLOY_PRIME_URL resolves to
# (see lib/deploy-origin.js) — DEPLOY_PRIME_URL is populated for branch deploys the same way it
# is for Deploy Previews, so staging--edenatlas.netlify.app is allowed automatically once the
# branch deploy exists, with zero code/config change here.
#
# What THIS repo cannot do on its own (no Netlify CLI/API access in this environment — see the
# completion report for the exact manual steps):
#   1. Netlify site UI: Site configuration -> Build & deploy -> Deploy contexts -> Branch
#      deploys -> enable branch deploys for the `staging` branch specifically (not "all
#      branches," which would also branch-deploy every throwaway feature branch).
#   2. Firebase Console -> Authentication -> Settings -> Authorized domains: add the resulting
#      staging--edenatlas.netlify.app domain (Google Sign-In will otherwise reject it).
#   3. If/when a dedicated staging Firebase project is created (see js/environment.js /
#      firebase-init.js's isUsingIsolatedStagingBackend()): set STAGING_FIREBASE_API_KEY /
#      _AUTH_DOMAIN / _PROJECT_ID / _STORAGE_BUCKET / _MESSAGING_SENDER_ID / _APP_ID as Netlify
#      environment variables, scoped to the `staging` branch context only (Netlify UI: Site
#      configuration -> Environment variables -> add variable -> scope to "staging" branch).
#      Until all six are set, Staging safely reuses Production's Firebase project in read-mostly
#      fashion — see firebase-init.js's isStagingWritesUnsafe() and discover.js's write guard.

# firebase-admin ^14.2.0 (netlify/functions/assistant.js's one dependency) requires Node >=22 —
# matches package.json's own "engines" field. Explicit here too (not just left to Netlify's
# platform default, which can trail the latest LTS) because a Function bundled/run under an
# older Node version is exactly the kind of mismatch that produces confusing, hard-to-diagnose
# runtime errors rather than a clear "unsupported engine" failure at install time. Also written
# to .nvmrc for tools (and Netlify's own build image, which reads either) that check that file
# instead of this one.
[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# --- Phase 4: scheduled airing-reminder delivery ---
# Netlify Scheduled Functions (https://docs.netlify.com/functions/scheduled-functions/) —
# invokes netlify/functions/anime-airing-check.js on its own cron, independent of any browser
# request. Every 20 minutes is a deliberately conservative cadence: AniList's own
# nextAiringEpisode.timeUntilAiring is minute-granular at best, and this Function already re-reads
# fresh AniList data every run (never guesses/interpolates a schedule between runs) — see that
# file's own header comment.
#
# KNOWN GATE, not yet confirmed in this environment: Scheduled Functions availability can depend
# on the Netlify plan/account this site is on. This code path is otherwise fully inert and
# harmless until Netlify's dashboard actually shows it registered under
# Site configuration -> Functions -> Scheduled functions — deploying this repo does not, by
# itself, spend anything or enable a paid feature; it only takes effect if the Netlify account
# already supports Scheduled Functions. See the completion report for the exact manual
# verification step.
[functions."anime-airing-check"]
  schedule = "*/20 * * * *"

# --- Firebase Auth handler proxy (iOS standalone-PWA sign-in fix) ---
# Firebase's OAuth redirect flow serves its handler page at /__/auth/handler on whatever host
# is configured as `authDomain` (see firebase-init.js). Proxying that path through this site's
# own production domain instead of sending the browser to lfj-profolio.firebaseapp.com keeps
# the redirect flow same-origin end to end, which is what makes signInWithRedirect reliable
# inside an iOS home-screen-installed PWA (see login.html for the full flow). `force = true` so
# this always wins even if a future catch-all rewrite is added; no `publish`-directory
# interaction here since redirects are evaluated independently of the publish folder.
[[redirects]]
  from = "/__/auth/*"
  to = "https://lfj-profolio.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# --- Baseline security headers for the whole site ---
# Additive only: does not change caching behaviour for any page (service-worker.js already
# owns the app-shell caching strategy client-side) and does not touch Firebase/Google Sign-In,
# which this site depends on (an overly strict frame-ancestors/CSP here has broken Google
# Identity popups on other projects, so no CSP is introduced in this pass).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Function responses (this includes the future Qwen Atlas Assistant endpoint, not just health):
# never cached by a shared/browser cache — an AI answer or a live status check must always be
# treated as fresh, never replayed from a CDN/browser cache. `/.netlify/functions/*` is the
# real, Netlify-routed Function invocation path — distinct from the (now unpublished) static
# source directory `netlify/functions/` blocked structurally above.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
